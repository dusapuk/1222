    <!-- Preload the marketplace catalogue in parallel with the JS bundle so
         the React app can render as soon as both arrive. -->
    <link rel="preload" as="fetch" type="application/json" href="/data/marketplace.json" crossorigin />

    <!--
      Self-hosted Vazirmatn (see src/index.css). We preload the two
      weights used in the initial paint (regular body 400 + bold 700)
      so the browser starts fetching them in parallel with the JS
      bundle and CSS, eliminating the FOUT/CLS pop on first render.
    -->
    <link rel="preload" href="/fonts/vazirmatn-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vazirmatn-700.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      GitHub Pages SPA bootstrap. If we were redirected from `404.html`
      with the original path encoded in `?p=/foo&q=bar`, restore the URL
      before React mounts so the router sees the right route. Safe no-op
      on hosts that already rewrite to index.html (Vercel/Netlify/etc.).
    -->
    <script>
      ;(function () {
        var l = window.location
        if (l.search.indexOf('p=/') === 0 || l.search.indexOf('?p=/') === 0 || /[?&]p=\//.test(l.search)) {
          var q = l.search.slice(1)
          var parts = q.split('&')
          var pathPart = ''
          var rest = []
          for (var i = 0; i < parts.length; i++) {
            if (parts[i].indexOf('p=') === 0) {
              pathPart = decodeURIComponent(parts[i].slice(2)).replace(/~and~/g, '&')
            } else if (parts[i].indexOf('q=') === 0) {
              var qp = decodeURIComponent(parts[i].slice(2)).replace(/~and~/g, '&')
              rest.push(qp)
            } else {
              rest.push(parts[i])
            }
          }
          if (pathPart) {
            var search = rest.length ? '?' + rest.join('&') : ''
            window.history.replaceState({}, '', pathPart + search + l.hash)
          }
        }
      })()
    </script>
  </head>
  <body>
    <!--ssr-outlet-start-->
    <div id="root">
      <div
        id="initial-loading"
        style="

          align-items: center;
          justify-content: center;
          min-height: 100vh;
          font-family: 'Vazirmatn', system-ui, sans-serif;

          color: #c4c5d0;
        "

              border-top-color: #d4a853;
              border-radius: 50%;
              animation: pikart-spin 0.9s linear infinite;
            "
          ></div>
          <p style="font-size: 13px; color: #8a8b96;">در حال بارگذاری پی‌کارت…</p>
        </div>
      </div>
    </div>
    <!--ssr-outlet-end-->
    <style>
      @keyframes pikart-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
    <noscript>
      <!-- This block is rendered ONLY when the visitor has JavaScript
           disabled. We deliberately use <p>/<strong> here instead of
           <h1> so the page never has two <h1> elements in the DOM (the
           SSR-rendered React tree above already provides one). -->
      <div style="font-family: 'Vazirmatn', system-ui, sans-serif; padding: 24px; text-align: center; color: #c4c5d0; background: #0b0c10;">

        </p>
        <p>برای استفاده از پی‌کارت، لطفاً جاوااسکریپت مرورگر خود را فعال کنید.</p>
        <p>
          <a href="/sitemap.xml" style="color: #d4a853;">نقشه سایت</a> ·
          <a href="/categories" style="color: #d4a853;">دسته‌بندی‌ها</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
