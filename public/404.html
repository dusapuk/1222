<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,follow" />
    <title>پی‌کارت | در حال انتقال…</title>
    <!--
      SPA fallback for static hosts that cannot be configured to rewrite
      unknown paths to index.html (notably GitHub Pages). Based on the
      well-known rafgraph/spa-github-pages technique:

      1. The host serves this 404.html for any unknown URL.
      2. The script below converts the requested path into a query string
         (`?p=/the/original/path&q=...`) and redirects to the site root.
      3. The bootstrap script in index.html reads `p` and uses
         history.replaceState to restore the original URL before React
         renders, so the SPA router sees the right route.

      `pathSegmentsToKeep` should match the number of path segments owned
      by the SPA root. For a custom domain (e.g. pikart.ir) this is 0.
      For project pages on github.io (e.g. user.github.io/repo/) set to 1.
    -->
    <script>
      ;(function () {
        var pathSegmentsToKeep = 0
        var l = window.location
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?p=/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        )
      })()
    </script>
  </head>
  <body>
    در حال انتقال به صفحه اصلی…
  </body>
</html>
